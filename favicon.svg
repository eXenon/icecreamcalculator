<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- cone (waffle) -->
  <path d="M22 46 L32 60 L42 46 Z" fill="#D4A574" stroke="#5C3A1E" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- bottom scoop (mint) -->
  <ellipse cx="32" cy="40" rx="14" ry="10" fill="#B8E6C8" stroke="#5C3A1E" stroke-width="2.5"/>

  <!-- middle scoop (strawberry) -->
  <ellipse cx="32" cy="32" rx="12" ry="9" fill="#F8C8D4" stroke="#5C3A1E" stroke-width="2.5"/>

  <!-- top scoop (vanilla) -->
  <circle cx="32" cy="24" r="9" fill="#FFF8E7" stroke="#5C3A1E" stroke-width="2.5"/>

  <!-- cherry -->
  <circle cx="32" cy="14" r="4.5" fill="#E04040" stroke="#5C3A1E" stroke-width="2"/>
  <!-- cherry highlight -->
  <ellipse cx="30.5" cy="12.5" rx="1.3" ry="1" fill="#F08080" opacity="0.7"/>

  <!-- eyes on top scoop (cute!) -->
  <circle cx="28.5" cy="24" r="1.5" fill="#5C3A1E"/>
  <circle cx="35.5" cy="24" r="1.5" fill="#5C3A1E"/>
  <!-- shy mouth -->
  <path d="M29.5 27.5 Q32 29.5 34.5 27.5" fill="none" stroke="#5C3A1E" stroke-width="1" stroke-linecap="round"/>
</svg>
